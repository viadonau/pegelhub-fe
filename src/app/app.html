@if (showShell()) {
  <div class="ph-app-shell">
    <ph-toolbar>
      <div ph-toolbar-start class="ph-brand">
        <span class="ph-brand-mark">PH</span>
        <span>PegelHub</span>
      </div>

      <div ph-toolbar-end class="ph-toolbar-actions">
        <span>{{ auth.userName() }}</span>
        <ph-button label="Logout" icon="pi pi-sign-out" variant="secondary" (clicked)="logout()" />
      </div>
    </ph-toolbar>

    <main class="ph-shell-main">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
