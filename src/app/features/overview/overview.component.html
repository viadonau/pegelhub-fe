<section class="ph-page">
  <header class="ph-page-header">
    <div class="ph-page-heading">
      <h1 class="ph-title">Stations</h1>
      <p class="ph-muted">
        @if (suppliers.isLoading() && stationCount() === 0) {
          Loading stations…
        } @else if (stationCount() === 1) {
          1 station
        } @else {
          {{ stationCount() }} stations
        }
      </p>
    </div>
    <ph-button
      label="Refresh stations"
      icon="pi pi-refresh"
      variant="secondary"
      [loading]="suppliers.isLoading()"
      (clicked)="suppliers.reload()"
    />
  </header>

  @if (suppliers.isLoading() && stationCount() === 0) {
    <ph-loading label="Loading stations" />
  } @else {
    @if (errorMessage(); as error) {
      <ph-message severity="error" [text]="error" />
    }

    <ph-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="suppliers.isLoading()"
      [clickable]="true"
      minWidth="40rem"
      actionLabel="Open station"
      emptyMessage="No stations to show. Your account might not have access to any yet."
      (rowAction)="openSupplier($event)"
    />
  }
</section>
