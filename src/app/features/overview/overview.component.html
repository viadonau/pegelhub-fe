<section class="ph-page ph-overview-page">
  <header class="ph-page-header">
    <div class="ph-page-heading">
      <h1 class="ph-title">Stations</h1>
      <p class="ph-overview-summary">
        <span>{{ stationCountLabel() }}</span>
        <span class="ph-overview-summary-status" [attr.data-status]="overviewStatusLabel()">
          {{ overviewStatusLabel() }}
        </span>
        <span class="ph-overview-summary-sync">Last sync {{ lastSyncLabel() }}</span>
      </p>
    </div>
    <ph-button
      label="Refresh"
      icon="pi pi-refresh"
      variant="secondary"
      [loading]="suppliers.isLoading()"
      (clicked)="suppliers.reload()"
    />
  </header>

  @if (suppliers.isLoading() && stationCount() === 0) {
    <ph-loading label="Loading stations" />
  } @else {
    @if (errorMessage(); as error) {
      <ph-message severity="error" [text]="error" />
    }

    <section class="ph-page-section ph-overview-table-section" aria-label="Supplier stations">
      <div class="ph-section-header ph-overview-filter-bar">
        <ph-search-field
          label="Filter stations"
          placeholder="Filter stations"
          clearLabel="Clear station filter"
          [value]="stationFilter()"
          (valueChange)="setStationFilter($event)"
        />
        @if (filterSummary(); as summary) {
          <p class="ph-muted ph-overview-filter-summary">{{ summary }}</p>
        }
      </div>

      <ph-table
        [columns]="columns"
        [rows]="filteredRows()"
        [loading]="suppliers.isLoading()"
        [clickable]="true"
        minWidth="100%"
        actionLabel="Open station"
        [emptyMessage]="emptyMessage()"
        (rowAction)="openSupplier($event)"
      />
    </section>
  }
</section>
