<main class="ph-login-page">
  <section class="ph-login-panel" aria-labelledby="login-title">
    <div class="ph-login-brand">
      <img
        src="brand/pegelhub-logo.png"
        alt=""
        class="ph-login-logo"
        width="96"
        height="72"
      />
      <span class="ph-login-wordmark">
        <span class="ph-login-name">PegelHub</span>
        <span class="ph-login-org">viadonau</span>
      </span>
    </div>

    <div class="ph-login-heading">
      <h1 id="login-title" class="ph-login-title">Sign in</h1>
      <p class="ph-login-copy">Use your viadonau account to continue.</p>
    </div>

    @if (errorMessage(); as error) {
      <ph-message severity="error" [text]="error" />
    }

    <ph-button label="Sign in" icon="pi pi-sign-in" [loading]="signingIn()" (clicked)="signIn()" />
  </section>
</main>
